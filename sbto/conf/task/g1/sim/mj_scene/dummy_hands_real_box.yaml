# Real cardboard box, 280 x 205 x 125 mm, stood so the 280 mm edge is VERTICAL
# (footprint 205 x 125). Rollout scene only -- the reference scene keeps the
# original OmniRetarget box, see sbto/tasks/task_mj_ref.py:30.
#
# Why this orientation: the demo's left forearm reaches to +0.151..+0.175 m above
# the box centre and hooks the top rim. A 280 mm vertical extent puts the rim at
# 0.140 m, so the hook survives; the 205 and 125 mm edges are too short for it.
_target_: sbto.sim.scene_mj.MjScene
cfg:
  _target_: sbto.sim.scene_mj.ConfigMjScene
  xml_scene_path: sbto/models/unitree_g1/scene_mjx_29dof_dummy_hands.xml
  xml_sensors_path:
  - sbto/models/unitree_g1/sensors/feet_contact.xml
  - sbto/models/unitree_g1/sensors/feet_pos.xml
  - sbto/models/unitree_g1/sensors/hands_pos.xml
  - sbto/models/unitree_g1/sensors/obj_collision.xml
  - sbto/models/unitree_g1/sensors/obj.xml
  - sbto/models/unitree_g1/sensors/dummy_hand_obj_contact.xml
  - sbto/models/unitree_g1/sensors/torso.xml
  - sbto/models/unitree_g1/sensors/self_collision.xml
  xml_contact_pairs_path:
  - sbto/models/unitree_g1/contact_pairs/reduced.xml
  - sbto/models/unitree_g1/contact_pairs/robot_obj_collision.xml
  - sbto/models/unitree_g1/contact_pairs/dummy_hand_robot_obj.xml
  add_body:

    empty_body:
      type: body_only
      pos: [0.4, 0.0, 0.1]
      euler: [0., 0., 0.]

    obj:
      type: box
      # pos.z = 0.0105 + (0.17 - half_z), same compensation small_box.yaml makes,
      # so the bottom face rests on the floor in the static model. Note the solve
      # overrides this: set_initial_state(ref.x0) takes the object's start pose
      # from the demo npz, which fixes the box CENTRE. With half_z = 0.140 the
      # box therefore starts 21 mm off the floor and settles; the grasp does not
      # begin until frame ~130 of 395, so it has ample time.
      pos: [0., 0., 0.0405]
      # Half-extents. Full size 205 x 125 x 280 mm.
      size: [0.1025, 0.0625, 0.140]
      # Unchanged from box.yaml: preserves the demo's initial box orientation,
      # including the ~53.6 deg yaw offset. The footprint is no longer square,
      # so this yaw is now the only correct one (no 90 deg freedom).
      euler: [3.05, 0.11, 1.11]
      # TODO set to the measured mass of the real box, markers attached.
      mass: 0.6
      rgba: [0.3, 0.3, 0.3, 1.0]
      freejoint: true
      bodyname: empty_body
      group: 1
      priority: 1
      condim: 3
      contype: 0
      conaffinity: 1
      margin: 0.0
      gap: 0.0
      solref: [0.04, 1.]
      solmix: 3.
      friction: [0.6, 0.0001, 0.0001]
