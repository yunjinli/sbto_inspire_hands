# @package _global_
# Stock (no-hands) G1 lifting the *real* cardboard box: 280 x 205 x 125 mm,
# stood on its 205 x 125 footprint (see sim/mj_scene/real_box.yaml for the
# orientation rationale). Rollout scene only -- the reference scene keeps the
# OmniRetarget box the demo was recorded with.
#
# Reference: the same sub3_largebox_005 clip with 45 lead-in and 30 tail
# frames (1.5 s / 1 s at 30 fps), which lets the box settle onto the floor and
# the robot reach a steady initial pose before the grasp.
#
# Run:
#   python sbto/main.py +experiment=real_box
defaults:
  - override /task/g1/sim/mj_scene@task.sim.mj_scene: real_box

task:
  cfg_ref:
    motion_path: ./sbto/tasks/g1/motion/sub3_largebox_005_leadin_tail.npz
