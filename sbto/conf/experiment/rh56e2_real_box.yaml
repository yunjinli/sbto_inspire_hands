# @package _global_
# Inspire RH56E2 hands + the real cardboard box. Same as rh56e2_box but with
# the real_box rollout scene and the lead-in/tail padded reference
# (re-laid-out for the 41-actuator model with
# scripts/pad_motion_for_model.py) -- see experiment/real_box.yaml.
#
# Run:
#   python sbto/main.py +experiment=rh56e2_real_box
defaults:
  - override /task/g1/sim/mj_scene@task.sim.mj_scene: rh56e2_real_box
  - override /task/g1/mj_scene_ref@task.mj_scene_ref: rh56e2_box

task:
  cfg:
    hand_floor_collision: 0.25
    wrist_obj_collision: 0.25
  cfg_ref:
    motion_path: ./sbto/tasks/g1/motion/sub3_largebox_005_leadin_tail_rh56e2.npz
